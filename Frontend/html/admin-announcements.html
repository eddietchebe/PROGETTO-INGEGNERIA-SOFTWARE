<!DOCTYPE html>
<html>
<head>

    <meta charset="UTF-8">

    <title>Admin Announcements</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- CSS custom -->
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/interfaccia.css">

</head>

<body class="admin-theme">

    <div class="container mt-5">

        <div class="row justify-content-center">

            <div class="col-md-8">

                <div class="card shadow">

                    <div class="card-body">

                        <!-- HEADER -->
                        <div class="d-flex justify-content-between mb-4">

                            <h2 class="fw-bold">
                                📢 Comunicazione agli editor
                            </h2>

                            <button
                                class="btn btn-secondary"
                                onclick="window.location.href='/html/admin-users.html'"
                            >
                                ← Torna
                            </button>

                        </div>



                        <!-- TEXTAREA -->
                        <div class="mb-4">

                            <label class="form-label">
                                Messaggio
                            </label>

                            <textarea
                                id="message"
                                class="form-control"
                                rows="6"
                                placeholder="Scrivi una comunicazione..."
                            ></textarea>

                        </div>



                        <!-- BUTTONS -->
                        <div class="d-flex gap-2">

                            <button
                                class="btn btn-warning"
                                onclick="AdminAnnouncements.send()"
                            >
                                📢 Invia
                            </button>


                            <button
                                class="btn btn-danger"
                                onclick="Auth.logout()"
                            >
                                Logout
                            </button>

                        </div>



                        <!-- RESULT -->
                        <div
                            id="result"
                            class="mt-3"
                        ></div>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <script src="../js/auth.js"></script>
    <script src="../js/Api.js"></script>
    <script src="../js/admin-announcements.js"></script>

</body>
</html>
