<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">

<title>Create Post</title>

<!-- Bootstrap -->
<link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet"
>

<!-- CSS custom -->
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/interfaccia.css">

</head>

<body>

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-8">

            <div class="card shadow">

                <div class="card-body">

                    <!-- HEADER -->
                    <div class="d-flex justify-content-between mb-4">

                        <h2 class="fw-bold">
                            📝 Nuovo Post
                        </h2>

                        <button
                            class="btn btn-secondary"
                            onclick="window.location.href='/html/posts.html'"
                        >
                            ← Torna
                        </button>

                    </div>



                    <!-- TITLE -->
                    <div class="mb-3">

                        <label class="form-label">
                            Titolo
                        </label>

                        <input
                            type="text"
                            id="title"
                            class="form-control"
                            placeholder="Inserisci titolo"
                        >

                    </div>



                    <!-- CONTENT -->
                    <div class="mb-3">

                        <label class="form-label">
                            Contenuto
                        </label>

                        <textarea
                            id="content"
                            class="form-control"
                            rows="6"
                            placeholder="Scrivi il contenuto..."
                        ></textarea>

                    </div>



                    <!-- CATEGORY -->
                    <div class="mb-3">

                        <label class="form-label">
                            Categoria
                        </label>

                        <select
                            id="category"
                            class="form-select"
                        >

                            <option value="1">PHP</option>
                            <option value="2">Docker</option>
                            <option value="3">MySQL</option>
                            <option value="4">Security</option>
                            <option value="5">API</option>
                            <option value="6">Frontend</option>

                        </select>

                    </div>



                    <!-- TAGS -->
                    <div class="mb-4">

                        <label class="form-label">
                            Tags
                        </label>

                        <input
                            type="text"
                            id="tags"
                            class="form-control"
                            placeholder="backend, jwt, mysql"
                        >

                    </div>



                    <!-- BUTTONS -->
                    <div class="d-flex gap-2">

                        <button
                            class="btn btn-primary"
                            onclick="PostForm.create()"
                        >
                            Pubblica
                        </button>


                        <button
                            class="btn btn-danger"
                            onclick="Auth.logout()"
                        >
                            Logout
                        </button>

                    </div>



                    <!-- RESULT -->
                    <div
                        id="result"
                        class="mt-3"
                    ></div>

                </div>

            </div>

        </div>

    </div>

</div>

<script src="../js/auth.js"></script>
<script src="../js/Api.js"></script>
<script src="../js/createPost.js"></script>

</body>
</html>
