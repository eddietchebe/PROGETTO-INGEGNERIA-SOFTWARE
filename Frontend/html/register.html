<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">

<title>Register</title>

<!-- Bootstrap -->
<link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet"
>

<!-- CSS custom -->
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/interfaccia.css">

</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-8 col-lg-6">

            <div class="card shadow">

                <div class="card-body p-4">

                    <!-- TITLE -->
                    <div class="text-center mb-4">

                        <h2 class="fw-bold">
                            📝 Registrazione
                        </h2>

                        <p class="text-muted">
                            Crea un account nella piattaforma CMS
                        </p>

                    </div>



                    <!-- NAME -->
                    <div class="mb-3">

                        <label class="form-label">
                            Nome
                        </label>

                        <input
                            type="text"
                            id="name"
                            class="form-control"
                            placeholder="Inserisci nome"
                        >

                    </div>



                    <!-- EMAIL -->
                    <div class="mb-3">

                        <label class="form-label">
                            Email
                        </label>

                        <input
                            type="email"
                            id="email"
                            class="form-control"
                            placeholder="Inserisci email"
                        >

                    </div>



                    <!-- PASSWORD -->
                    <div class="mb-3">

                        <label class="form-label">
                            Password
                        </label>

                        <input
                            type="password"
                            id="password"
                            class="form-control"
                            placeholder="Inserisci password"
                        >

                    </div>



                    <!-- ROLE -->
                    <div class="mb-3">

                        <label class="form-label">
                            Ruolo
                        </label>

                        <select
                            id="role"
                            class="form-select"
                        >

                            <option value="editor">
                                ✍️ Registrati come Editor
                            </option>

                            <option value="admin">
                                👑 Registrati come Admin
                            </option>

                        </select>

                    </div>



                    <!-- ADMIN KEY -->
                    <div class="mb-4">

                        <label class="form-label">
                            Chiave Admin
                        </label>

                        <input
                            type="password"
                            id="adminKey"
                            class="form-control"
                            placeholder="Necessaria solo per admin"
                        >

                    </div>



                    <!-- BUTTON -->
                    <div class="d-grid">

                        <button
                            id="registerBtn"
                            class="btn btn-success"
                        >
                            Registrati
                        </button>

                    </div>



                    <!-- LOGIN -->
                    <div class="text-center mt-4">

                        Hai già un account?

                        <a href="/html/login.html">
                            Login
                        </a>

                    </div>



                    <!-- RESULT -->
                    <div
                        id="result"
                        class="mt-3 text-center"
                    ></div>

                </div>

            </div>

        </div>

    </div>

</div>

<script src="../js/auth.js"></script>
<script src="../js/Api.js"></script>
<script src="../js/register.js"></script>

</body>
</html>
